<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;font-size:2rem;margin-bottom:5px;background:linear-gradient(90deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#888;font-size:.85rem;margin-bottom:25px}
.card{background:#1a1a2e;border:1px solid #2a2a40;border-radius:12px;padding:20px;margin-bottom:15px}
.dropzone{border:2px dashed #3a3a55;border-radius:10px;padding:35px;text-align:center;cursor:pointer;transition:.2s;background:#12121f}
.dropzone:hover,.dropzone.dragover{border-color:#00d4ff;background:#0a1a2a}
.dropzone p{color:#aaa;font-size:.9rem}
#fileInput{display:none}
textarea{width:100%;min-height:100px;background:#0d0d18;border:1px solid #2a2a40;border-radius:8px;padding:12px;color:#e0e0e0;font-family:monospace;font-size:.8rem;resize:vertical;margin-top:10px}
.or{text-align:center;color:#555;font-size:.8rem;margin:12px 0}
.btn{background:linear-gradient(90deg,#00d4ff,#a855f7);color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,212,255,.25)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.progress{display:none;margin-top:15px}
.progress-bar{height:6px;background:#2a2a40;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#a855f7);width:0%;transition:.3s}
.progress-text{text-align:center;font-size:.8rem;color:#888;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.stat{background:#1a1a2e;border:1px solid #2a2a40;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.7rem;color:#888;margin-top:2px}
.results{max-height:400px;overflow-y:auto}
.item{padding:10px;border-radius:8px;margin-bottom:6px;font-size:.82rem;display:flex;align-items:flex-start;gap:8px;word-break:break-all}
.item.s{background:rgba(0,255,127,.08);border:1px solid rgba(0,255,127,.2)}
.item.f{background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.2)}
.item.c{background:rgba(255,165,0,.08);border:1px solid rgba(255,165,0,.2)}
.item.e{background:rgba(128,128,128,.08);border:1px solid rgba(128,128,128,.2)}
.badge{padding:2px 8px;border-radius:12px;font-size:.65rem;font-weight:700;white-space:nowrap}
.badge.s{background:#00ff7f;color:#000}
.badge.f{background:#ff4757;color:#fff}
.badge.c{background:#ffa500;color:#000}
.badge.e{background:#888;color:#fff}
.logs{background:#0a0a12;border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:.75rem;line-height:1.4;margin-top:12px;border:1px solid #1a1a30}
.logs:empty{display:none}
.log-line{margin-bottom:2px}
.log-i{color:#00d4ff}.log-s{color:#00ff7f}.log-f{color:#ff4757}.log-c{color:#ffa500}
.dl-btn{display:none;margin-top:12px}
.warn{text-align:center;font-size:.7rem;color:#555;margin-top:20px;padding-top:15px;border-top:1px solid #1a1a30}
</style>
</head>
<body>
<div class="container">
<h1>Login Scanner</h1>
<p class="subtitle">Format: url:username:password (satu per baris)</p>

<div class="card">
  <div class="dropzone" id="dropzone">
    <p style="font-size:1.5rem;margin-bottom:5px">📁</p>
    <p>Drop file <b>list.txt</b> di sini atau klik</p>
    <input type="file" id="fileInput" accept=".txt">
  </div>
  <p class="or">— ATAU PASTE MANUAL —</p>
  <textarea id="paste" placeholder="https://site.com/login:admin:password123&#10;https://target.com/wp-login.php:admin:admin"></textarea>
  <div style="text-align:center;margin-top:15px">
    <button class="btn" id="go" onclick="run()">🚀 Mulai Scan</button>
  </div>
  <div class="progress" id="prog">
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="progress-text" id="ptxt">0 / 0</div>
  </div>
  <div class="logs" id="logs"></div>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="stat-num" id="st0" style="color:#00d4ff">0</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-num" id="st1" style="color:#00ff7f">0</div><div class="stat-label">Sukses</div></div>
  <div class="stat"><div class="stat-num" id="st2" style="color:#ff4757">0</div><div class="stat-label">Gagal</div></div>
  <div class="stat"><div class="stat-num" id="st3" style="color:#ffa500">0</div><div class="stat-label">Captcha</div></div>
</div>

<div class="card" id="outbox" style="display:none">
  <h3 style="margin-bottom:10px;font-size:1rem">📋 Hasil</h3>
  <div class="results" id="out"></div>
  <button class="btn dl-btn" id="dl" onclick="download()">💾 Download</button>
</div>

<p class="warn">Gunakan hanya untuk testing keamanan sistem milik sendiri.</p>
</div>

<script>
const $ = id => document.getElementById(id);
let saved = [];

$('dropzone').onclick = () => $('fileInput').click();
$('dropzone').ondragover = e => { e.preventDefault(); $('dropzone').classList.add('dragover'); };
$('dropzone').ondragleave = () => $('dropzone').classList.remove('dragover');
$('dropzone').ondrop = e => {
  e.preventDefault(); $('dropzone').classList.remove('dragover');
  const f = e.dataTransfer.files[0]; if(f) read(f);
};
$('fileInput').onchange = e => { if(e.target.files[0]) read(e.target.files[0]); };

function read(file){
  const r = new FileReader();
  r.onload = e => { $('paste').value = e.target.result; };
  r.readAsText(file);
  $('dropzone').innerHTML = '<p style="color:#00d4ff;font-weight:600">✅ ' + file.name + ' loaded</p>';
}

function log(msg, t='i'){
  const d = document.createElement('div'); d.className = 'log-line log-'+t; d.textContent = msg;
  $('logs').appendChild(d); $('logs').scrollTop = $('logs').scrollHeight;
}

async function run(){
  const lines = $('paste').value.split('\n').map(l=>l.trim()).filter(l=>l);
  if(!lines.length){ alert('Isi data dulu!'); return; }
  $('go').disabled = true; $('prog').style.display='block'; $('stats').style.display='grid'; $('outbox').style.display='block';
  $('out').innerHTML=''; $('logs').innerHTML=''; saved=[];
  let s=0,f=0,c=0;
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    $('fill').style.width = Math.round((i+1)/lines.length*100)+'%';
    $('ptxt').textContent = (i+1)+' / '+lines.length;
    log('['+(i+1)+'/'+lines.length+'] '+line.substring(0,55)+'...');
    try{
      const res = await fetch('/api', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({line:line, idx:i+1})
      });
      const d = await res.json();
      if(d.status==='success'){ s++; add('s',d.msg,d.det); log('✓ '+d.msg,'s'); saved.push('[OK] '+line); }
      else if(d.status==='captcha'){ c++; add('c',d.msg,d.det); log('⚠ '+d.msg,'c'); saved.push('[CAPTCHA] '+line); }
      else if(d.status==='fail'){ f++; add('f',d.msg,d.det); log('✗ '+d.msg,'f'); }
      else{ add('e',d.msg,d.det); log('! '+d.msg,'f'); }
      $('st0').textContent=i+1; $('st1').textContent=s; $('st2').textContent=f; $('st3').textContent=c;
    }catch(e){ log('X '+e.message,'f'); }
    await new Promise(r=>setTimeout(r,600));
  }
  $('ptxt').textContent='Selesai!'; $('go').disabled=false;
  if(saved.length) $('dl').style.display='inline-block';
  log('Done!','s');
}

function add(t,msg,det){
  const d=document.createElement('div'); d.className='item '+t;
  const b={s:'badge s',f:'badge f',c:'badge c',e:'badge e'};
  const l={s:'OK',f:'FAIL',c:'CAPTCHA',e:'ERR'};
  d.innerHTML='<span class="'+b[t]+'">'+l[t]+'</span><span>'+msg+(det?'<br><small style="color:#888">'+det+'</small>':'')+'</span>';
  $('out').appendChild(d);
}

function download(){
  const blob=new Blob([saved.join('\n')],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='results_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.txt';
  a.click();
}
</script>
</body>
</html>
